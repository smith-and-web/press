name: Design system

on:
  push:
    paths:
      - "design-system/**"
      - ".github/workflows/design-system.yml"
  pull_request:
    paths:
      - "design-system/**"
      - ".github/workflows/design-system.yml"

jobs:
  token-drift:
    name: Token mirror agrees with CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: node design-system/generate-tokens.mjs --check
